  { id = "question", definition = "ask for clarification", color = "yellow" },
  { id = "suggestion", definition = "possible improvements" },
  { id = "issue", definition = "problems to fix", color = "red" },
  { id = "praise", definition = "positive feedback", color = "green" },
  { id = "nit", label = "nitpick", definition = "small optional tweaks", color = "#d19a66" },
  { id = "note", definition = "additional context", color = "#ffa296" },
  { id = "description", definition = "review surface summary", color = "#f57d27" },
  { id = "reply", definition = "agent reserved response to comment.", color = "#c586c0" },
]
